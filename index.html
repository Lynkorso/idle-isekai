<script>
const $=id=>document.getElementById(id);
const CONT=[
{n:"Prateria Verde",bg:"#2c5e2e,#7fbf5a",m:["🟢|Slime","🐸|Rana Velenosa","🐀|Ratto Gigante","🐝|Ape Furiosa"],b:"🐗|Cinghiale Re"},
{n:"Foresta Oscura",bg:"#16301f,#3b5d3a",m:["👺|Goblin","🕷️|Ragno","🐺|Lupo Nero","🦇|Pipistrello"],b:"🐻|Orso Gigante"},
{n:"Deserto Rovente",bg:"#a8741f,#e8c26b",m:["🦂|Scorpione","🐍|Serpente","💀|Scheletro","🦅|Avvoltoio"],b:"🗿|Golem di Sabbia"},
{n:"Ghiacci Eterni",bg:"#2a4a6e,#b9dcf5",m:["🐧|Pinguino Furioso","🐺|Lupo delle Nevi","🦣|Mammut","🐻‍❄️|Orso Polare"],b:"🧊|Colosso di Ghiaccio"},
{n:"Monte Vulcano",bg:"#4a1410,#d9531e",m:["🔥|Fuoco Fatuo","🦎|Salamandra","😈|Diavoletto","🦀|Granchio di Magma"],b:"🌋|Titano di Lava"},
{n:"Cimitero Maledetto",bg:"#1b1830,#4a3f66",m:["🧟|Zombie","💀|Spettro Osseo","👻|Fantasma","🎃|Zucca Maledetta"],b:"🧛|Vampiro Antico"}];
const PER=20,KILLS=10,CAP=CONT.length*PER;
const HT=[[0,"🧑‍🌾","Viandante"],[15,"🤺","Avventuriero"],[40,"🛡️","Cavaliere"],[90,"🦸","Eroe"],[180,"👑","Leggenda"]];
const D={gold:0,gems:0,u:{d:0,s:0,c:0,g:0,v:0,f:0,r:0},rl:0,n:0,cl:0,rm:0,pp:0,pr:0,k:0,t:Date.now(),bA:0,bD:0,bL:0,pets:{},pa:-1,fo:{0:1},fr:0,nick:"Eroe",ct:0,hold:0,st:{mu:1,fx:1,vb:1},wh:0,fg:0,fgd:"",fgn:0,nc:0,ap:0,tr:{d:0,v:0,g:0,s:0,o:0},ps:{},sk:0,sks:{0:1},sa:{},tp:0,pvd:"",pvn:0,dw:0,dd:0,dcl:0,ddd:"",ddn:0,wd:"",wn:0,gDay:"",gx:0};
function load(){try{const j=JSON.parse(localStorage.getItem("eroe3"));if(j)return Object.assign({},D,j,{u:Object.assign({},D.u,j.u)})}catch(e){}return JSON.parse(JSON.stringify(D))}
let S=load();
function save(){S.t=Date.now();try{localStorage.setItem("eroe3",JSON.stringify(S))}catch(e){}if(Date.now()-lc>20000){lc=Date.now();try{Telegram.WebApp.CloudStorage.setItem("save",JSON.stringify(S))}catch(e){}}}
let lc=0;
const day=()=>new Date().toLocaleDateString("sv");
const PETS=[["🐺","Lupo","d",.1],["🐢","Tartaruga","v",.1],["🦊","Volpe","g",.1],["🐉","Draghetto","d",.2],["🦄","Unicorno","v",.2],["🦉","Gufo","g",.2],["🔥","Fenice","d",.5]];
const F=[["Nessuna","#555",0,""],["Bronzo","#cd7f32",10,""],["Argento","#d0d4dc",25,""],["Oro","#ffd54a",50,""],["Diamante","#6fe3ff",100,"💎"],["Magica","#a06bff",60,"✨"],["Fuoco","#ff6a1f",60,"🔥"],["Ghiaccio","#8fd3f4",60,"❄️"],["Natura","#3fb56b",60,"🍃"],["Fulmine","#ffe14a",70,"⚡"],["Oscura","#6b1fa0",80,"🌙"],["Sacra","#fff2a8",80,"🕊️"],["Drago","#e5484d",120,"🐉"],["Regale","#ffd54a",150,"👑"]];
const NP=[[50,250],[125,205],[215,230],[262,150],[170,108],[78,62]];
const pb=t=>{const p=PETS[S.pa];return p&&p[2]===t?plv(S.pa)*p[3]:0};
const bm=()=>Date.now()<S.bA?2:1;
const pm=k=>1.2**((S.tr&&S.tr[k])||0);
const compl=()=>(S.cl/CAP*50+Math.min(1,Object.values(S.tr||{}).reduce((a,b)=>a+b,0)/300)*20+PETS.filter((p,i)=>plv(i)>0).length/PETS.length*15+(Object.keys(S.sks||{}).length+Object.keys(S.fo||{}).length)/(SK.length+F.length)*15);
const dmg=()=>3*(1+.5*S.u.d)*1.05**S.u.d*(1+.1*S.rl)*pm('d')*(1+pb('d'))*bm();
const hps=()=>Math.min(12,(1+.08*S.u.s)*(1+.05*((S.tr&&S.tr.s)||0)));
const critC=()=>Math.min(.5,.01*S.u.c);
const avg=()=>dmg()*(1+critC()*2);
const luck=()=>Math.min(1,Math.min(.75,.01*S.u.g)+(Date.now()<S.bL?.3:0));
const maxHP=()=>50*(1+.5*S.u.v)*1.05**S.u.v*pm('v')*(1+pb('v'));
const red=()=>Math.min(.75,.01*S.u.f);
const regen=()=>maxHP()*.002*S.u.r;
const eAtk=(n,b)=>2*1.2**n*b;
const hpOf=n=>Math.floor(10*1.25**n);
const goldOf=n=>Math.ceil(3*1.2**n*pm('g')*(1+pb('g')));
const UP=[["d","⚔️ Danno",l=>Math.floor(10*1.25**l),()=>"Danno "+fmt(dmg()),0],
["s","⚡ Velocità",l=>Math.floor(40*1.35**l),()=>hps().toFixed(2)+" colpi/s",100],
["c","🎯 Critico",l=>Math.floor(60*1.35**l),()=>Math.round(critC()*100)+"% (danno x3)",50],
["g","🍀 Fortuna",l=>Math.floor(50*1.25**l),()=>Math.round(luck()*100)+"% di oro doppio",75],
["v","❤️ Vita",l=>Math.floor(10*1.25**l),()=>"Vita max "+fmt(maxHP()),0],
["f","🛡️ Difesa",l=>Math.floor(40*1.35**l),()=>Math.round(red()*100)+"% danni in meno",75],
["r","💚 Rigenerazione",l=>Math.floor(40*1.35**l),()=>(regen()/maxHP()*100).toFixed(1)+"% vita al secondo",100]];
function fmt(x){if(x<1000)return Math.floor(x).toString();const u=["","K","M","B","T","Qa","Qi"];let i=0;while(x>=1000&&i<6){x/=1000;i++}return(x>=1000?x.toExponential(2):(x<10?x.toFixed(2):x<100?x.toFixed(1):Math.floor(x)))+u[i]}
function heroOf(){const T=S.u.d+S.u.s+S.u.c+S.u.g;let h=HT[0];HT.forEach(x=>{if(T>=x[0])h=x});return[h[1],h[2],HT.indexOf(h)]}
let E=null,mode="n",gL=0,gt=0,tleft=0,acc=0,tt,php=1;
const isBoss=()=>S.n%5===4;
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",2500)}
function spawn(){
 const C=CONT[Math.min(Math.floor(S.n/PER),CONT.length-1)];let emo,nm,hp,boss=isBoss()&&S.k>=KILLS,big=S.n%PER===PER-1;
 if(boss){[emo,nm]=(big?C.b:C.m[(S.n+1)/5%C.m.length|0]).split("|");if(!big)nm="Elite "+nm;hp=hpOf(S.n)*(big?8:4);tleft=30}
 else{[emo,nm]=C.m[Math.floor(Math.random()*C.m.length)].split("|");hp=hpOf(S.n)}
 E={emo,nm,hp,max:hp,boss};show()}
function show(){
 const a=$("arena"),e=$("en");
 a.style.background=mode==="g"?"linear-gradient(#3a0d12,#7a2a1f)":"linear-gradient("+CONT[Math.min(Math.floor(S.n/PER),CONT.length-1)].bg+")";
 {const c2=mode==="g"?-1:Math.min(Math.floor(S.n/PER),5);if(sck!==c2){sck=c2;$("sc").innerHTML=c2<0?"":scene(c2)}}e.innerHTML=mSVG2(E.nm,E.boss||mode==="g");e.className="";void e.offsetWidth;e.className="in"+(E.boss||mode==="g"?" big":"");
 $("enm").textContent=(E.boss?"👑 BOSS: ":"")+E.nm}
function pop(d,cr){const a=$("arena");if(a.children.length>14)return;const p=document.createElement("div");p.className="pop"+(cr?" cr":"");p.textContent=fmt(d);p.style.right=(20+Math.random()*70)+"px";p.style.top=(30+Math.random()*50)+"px";a.appendChild(p);setTimeout(()=>p.remove(),700)}
function hit(){let d=dmg();const cr=Math.random()<critC();if(cr)d*=3;E.hp-=d;pop(d,cr);if(E.hp<=0)kill()}
function adv(boss){
 const first=S.n>=S.cl;
 if(first){S.cl=S.n+1;if(boss){const g=S.n%PER===PER-1?2+Math.floor(S.n/PER):1;S.gems+=g;toast("👑 Boss sconfitto! +"+g+"💎")}}
 if(S.n<CAP-1&&!S.hold){S.n++;S.rm=Math.max(S.rm,S.n);if(first&&S.n%PER===0)toast("🗺️ Nuovo continente: "+CONT[S.n/PER].n)}}
function kill(){
 if(mode==="g"){endGiant(true);return}
 {let g=goldOf(S.n)*(E.boss?5:1);if(Math.random()<luck())g*=2;S.gold+=g}
 if(E.boss){S.k=0;adv(true)}
 else{S.k++;if(S.k>=KILLS&&!isBoss()){S.k=0;adv(false)}}
 spawn()}
function giant(L){
 if(mode==="g")return;const t=day();
 if(S.gDay!==t)S.gDay=t;else if(S.gx>0)S.gx--;else return;
 mode="g";gL=L;const hp=Math.floor(avg()/bm()*hps()*20*[.5,1,1.8][L]);
 E={emo:"👹",nm:"Gigante",hp,max:hp,boss:false};gt=20;acc=0;show();toast("Il gigante arriva!")}
function endGiant(w){
 mode="n";
 if(w){const g=[1,3,6][gL],o=Math.floor(goldOf(S.n)*[40,100,250][gL]);S.gems+=g;S.gold+=o;toast("🏆 Gigante sconfitto! +"+g+"💎 +"+fmt(o)+"💰")}
 else toast("Il gigante resiste... riprova domani");
 S.k=0;spawn()}
let last=performance.now();
function tick(){
 const now=performance.now(),dt=Math.min((now-last)/1000,1);last=now;if(!E)return;
 acc+=dt*hps();while(E&&acc>=1){acc--;hit()}
 if(mode==="g"){gt-=dt;if(gt<=0)endGiant(false)}
 else if(E.boss){tleft-=dt;if(tleft<=0){S.k=0;toast("Il boss ti ha sconfitto, ritenta!");spawn()}}
 if(mode==="n"){ea+=dt;const iv=E.boss?1.2:1.5;php=Math.min(maxHP(),php+regen()*dt);if(ea>=iv){ea=0;const d=eAtk(S.n,E.boss?2:1)*iv*(1-red())*(Date.now()<S.bD?.5:1);php-=d;hurt(d);if(php<=0){die();return}}}
 else php=Math.min(maxHP(),php+regen()*dt);
 draw()}
function draw(){
 $("gold").textContent=fmt(S.gold);$("gems").textContent=S.gems;const hh=heroOf();const hk=hh[2]+'-'+S.sk;if(hk!==ht){ht=hk;$("hero").innerHTML=heroSVG(hh[2])}$("av").textContent=hh[0];$("av").style.borderColor=F[S.fr][1];$("av").style.boxShadow=S.fr?"0 0 8px "+F[S.fr][1]:"none";$("pnm").textContent=S.nick+" "+(F[S.fr][3]||"");$("ptt").textContent=hh[1]+" · 🔱 "+S.pp;$("arena").style.boxShadow=S.fr?"0 0 0 3px "+F[S.fr][1]:"none";
 $("hpf").style.width=Math.max(0,E.hp/E.max*100)+"%";$("hptx").textContent=fmt(Math.max(0,E.hp))+" / "+fmt(E.max);
 $("ci").textContent=mode==="g"?"👹 Sfida del Gigante":CONT[Math.min(Math.floor(S.n/PER),CONT.length-1)].n+" · Tappa "+(S.n%PER+1)+"/"+PER;
 $("pr").textContent=mode==="g"?"⏱ "+Math.ceil(gt)+"s":E.boss?"⏱ "+Math.ceil(tleft)+"s":"Mostri "+S.k+"/"+KILLS;
 const L=(x,a)=>Date.now()<x?"🔥 "+Math.ceil((x-Date.now())/1000)+"s":a;
 $("bA").textContent=L(S.bA,"📺 ⚔️ x2");$("bD").textContent=L(S.bD,"📺 🛡️ -50%");$("bL").textContent=L(S.bL,"📺 🍀 +30%");
 $("hpp").style.width=Math.max(0,php/maxHP()*100)+"%";$("hpt2").textContent="❤️ "+fmt(Math.max(0,php))+" / "+fmt(maxHP());
 $("cmp").textContent=compl().toFixed(2)+"%"}
/* ANNUNCI: questa è una finta pubblicità di prova.
   Qui dentro andrà il codice della rete pubblicitaria reale (es. Adsgram/Monetag); chiamare cb() quando l'utente ha finito di guardarla. */
function ad(cb){const o=$("ov");o.innerHTML='<div class="box"><b>📺 Annuncio di prova</b><p id="adc">3</p></div>';o.style.display="flex";let c=3;
 const t=setInterval(()=>{c--;if(c<=0){clearInterval(t);o.style.display="none";cb()}else $("adc").textContent=c},1000)}
function boost(k){const f="b"+k;if(Date.now()<S[f]){toast("Boost già attivo");return}ad(()=>{S[f]=Date.now()+90000;toast("🔥 Boost attivo per 90s")})}
function die(){toast("💀 Sei stato sconfitto! Torni indietro di una tappa");S.n=Math.max(0,S.n-1);S.k=0;php=maxHP();spawn()}
function cl2(){$("ov").style.display="none"}
function gain(){return Math.floor((S.rm+1)**1.5/8)}
function rPr(){const g=gain();return '<div class="card"><b>🔱 Rinascita</b><br><small>Reincarnati: perdi oro, potenziamenti e tappa, ma ottieni Anime che danno +10% a danno, vita e oro per sempre. Gemme, reliquie e mappa restano.</small></div><div class="card">Anime: <b>'+S.pp+'</b> (bonus +'+S.pp*10+'%) · Rinascite: '+S.pr+'<br>Tappa più alta in questa vita: '+(S.rm+1)+'<br><br><button '+(g>=1?'':'disabled')+' onclick="prestige()">Rinasci: +'+g+' 🔱</button></div>'}
function prestige(){const o=$("ov");o.innerHTML='<div class="box"><b>Rinascere?</b><p>Ottieni '+gain()+' 🔱 e ricominci da zero.</p><button onclick="doPr()">Sì</button><button onclick="cl2()">No</button></div>';o.style.display="flex"}
function doPr(){S.pp+=gain();S.pr++;S.gold=0;S.u={d:0,s:0,c:0,g:0,v:0,f:0,r:0};S.n=0;S.k=0;S.rm=0;mode="n";php=maxHP();cl2();spawn();tab("hero");toast("🔱 Sei rinato! Bonus +"+S.pp*10+"%")}
let pend=0;
function offline(){
 const secs=Math.min((Date.now()-S.t)/1000,28800*(1+.25*((S.tr&&S.tr.o)||0)));if(secs<60)return;
 const kt=Math.max(hpOf(S.n)/(avg()*hps()),.3);pend=Math.floor(goldOf(S.n)/kt*secs*.5*(1+luck()));if(pend<1)return;
 const o=$("ov");o.innerHTML='<div class="box"><b>Bentornato, eroe!</b><p>Mentre eri via hai guadagnato <b>'+fmt(pend)+'</b> 💰</p><button onclick="claim(1)">Ritira</button><button onclick="claim(2)">📺 Raddoppia</button></div>';o.style.display="flex"}
function claim(m){$("ov").style.display="none";if(m===1)S.gold+=pend;else ad(()=>{S.gold+=pend*2})}
function buy(k,all){const u=UP.find(x=>x[0]===k);let n=0;
 do{const l=S.u[k],c=u[2](l);if(S.gold<c||(u[4]&&l>=u[4]))break;S.gold-=c;S.u[k]++;n++}while(all&&n<500);render()}
function buyRL(){const c=3+2*S.rl;if(S.gems>=c){S.gems-=c;S.rl++;render()}}
function rHero(){
 const h=heroOf();
 let s='<div class="card"><b>'+h[0]+' '+h[1]+'</b><br><small>Danno '+fmt(dmg())+' · '+hps().toFixed(2)+' colpi/s · DPS '+fmt(avg()*hps())+'</small></div>';
 UP.forEach(u=>{const l=S.u[u[0]],c=u[2](l),mx=u[4]&&l>=u[4],ok=S.gold>=c;
